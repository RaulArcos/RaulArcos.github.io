<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blindspot Overlay</title>
    <link rel="stylesheet" href="assets/blindspot/blindspot.css">
    <link rel="stylesheet" href="assets/common/css/overlay-theme.css">
    <link rel="stylesheet" href="assets/common/css/race-system.css">
    <script src="assets/common/js/overlay_theme.js"></script>
    <script src="assets/blindspot/blindspot.js"></script>
    <script src="assets/common/js/socket.io.min.js"></script>
<script src="assets/common/js/overlay_settings.js"></script>
<script src="assets/common/js/demo_race.js"></script><script src="assets/common/js/demo_scenario.js"></script><script src="assets/common/js/demo_adapter.js"></script>
</head>
<body>
    <div id="proximity-panel" class="blindspot-container rah-race rah-card pywebview-drag-region">
        <div class="rah-card__header"><span>Blind spot</span><span>SPOTTER</span></div>
        <div class="blindspot-body">
            <div id="left-zone" class="zone"><span class="tile-light"></span><span id="left-label">LEFT ?</span></div>
            <div class="center-zone"><div id="status-msg" class="status-msg" role="status">Spotter unavailable</div><div class="spotter-source">iRacing side alerts</div></div>
            <div id="right-zone" class="zone"><span class="tile-light"></span><span id="right-label">RIGHT ?</span></div>
        </div>
    </div>
</body>
</html>
